[package]
name = "oresat-c3-watchdog"
version = "0.2.0"
authors = ["Theo Hill <Theo0x48@gmail.com>"]
edition = "2024"
description = "Pets the hardware watchdog on the C3"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
gpiod = "0.3.0"
gpiosim = "0.4.2"
mio = { version = "1.2.1", features = ["net", "os-poll", "os-ext"] }
# Fixed at the same version that gpiod is using
nix = { version = "0.26.4", features = ["signal", "time"] }

[package.metadata.deb]
maintainer-scripts = "debian/"
# cargo-deb somehow resolves the wrong libc (2.35 currently)
# even though the cross toolchain uses 2.31.
depends = "libc6:armhf (>= 2.31)"
systemd-units = { enable = true }

[profile.release]
lto = true
